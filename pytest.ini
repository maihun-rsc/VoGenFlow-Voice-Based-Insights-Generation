[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    unit: Tier 1 fast in-memory deterministic unit and contract tests (zero network)
    integration: Tier 2 real ephemeral infrastructure and database tests
    evals: Tier 3 AI and semantic evaluation metrics (Faithfulness, Recall, Garak)
    e2e: Tier 4 live headless browser simulations via Playwright
filterwarnings =
    ignore::DeprecationWarning
